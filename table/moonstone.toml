manifest_version = 2

[package]
name = "hydronium/table"
registry_name = "hydronium"
version = "0.2.1"
kind = "lib"
description = "Headless reactive table state for Hydronium"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.0"
role = "tool"

[[dependencies]]
name = "hydronium/core"
constraint = "path:../core"
registry = "path"
role = "runtime"
