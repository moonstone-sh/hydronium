manifest_version = 2

[package]
name = "moonstone/hydronium-ballad"
version = "0.1.0"
kind = "lib"
description = "Hydronium's ballad plugins: .luax compile, CSS/assets, and client bundling/minification"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.7"
role = "tool"

[[dependencies]]
name = "moonstone/hydronium"
constraint = "path:../core"
registry = "path"
role = "runtime"

[[dependencies]]
name = "moonstone/hydronium-luax"
constraint = "path:../luax"
registry = "path"
role = "runtime"

[[dependencies]]
name = "moonstone/hydronium-dom"
constraint = "path:../dom"
registry = "path"
role = "runtime"
