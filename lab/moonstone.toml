manifest_version = 2

[package]
name = "hydronium/lab"
registry_name = "hydronium"
version = "0.2.0"
kind = "lib"
description = "Host-neutral component stories and registries for Hydronium Labs"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.0"
role = "tool"

[[dependencies]]
name = "hydronium/core"
constraint = "path:../core"
registry = "path"
role = "runtime"

# The shared Workbench is authored as LUAX and loaded through its conventional
# Lua shim. Keep the compiler/runtime edge direct so hosts do not have to
# provide an undeclared transitive dependency.
[[dependencies]]
name = "hydronium/luax"
constraint = "path:../luax"
registry = "path"
role = "runtime"
