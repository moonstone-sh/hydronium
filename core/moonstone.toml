manifest_version = 2

[package]
name = "moonstone/hydronium"
version = "0.1.0"
kind = "lib"
description = "Hydronium reactive UI core for Lua and LuaJIT"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
dev = "lua ./main.lua \"$@\""
package = "moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.7"
role = "tool"
