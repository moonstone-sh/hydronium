manifest_version = 2

[package]
name = "hydronium/ink-lab"
version = "0.1.0"
kind = "lib"
description = "Hydronium Ink stories in a browser-rendered virtual terminal"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.7"
role = "tool"

[[dependencies]]
name = "hydronium/core"
constraint = "path:../core"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/dom"
constraint = "path:../dom"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/ink"
constraint = "path:../ink"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/lab"
constraint = "path:../lab"
registry = "path"
role = "runtime"

# `hydronium_ink_lab.dom` is a LUAX document loaded by a Lua shim. Declare the
# loader directly rather than relying on whichever HTTP host happens to mount
# the renderer.
[[dependencies]]
name = "hydronium/luax"
constraint = "path:../luax"
registry = "path"
role = "runtime"
