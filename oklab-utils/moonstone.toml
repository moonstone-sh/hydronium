manifest_version = 2

[package]
name = "hydronium/oklab-utils"
version = "0.3.0"
kind = "lib"
description = "Portable OKLab, OKLCH, and sRGB color utilities for Hydronium"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.0"
role = "tool"
