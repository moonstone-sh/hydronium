manifest_version = 2

[package]
name = "hydronium/cli"
version = "0.2.0"
kind = "bin"
description = "Hydronium developer CLI: `hydronium dev` wraps a Meteorite dev server with a live Hydronium Ink status view"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec -- ballad play partiture.lua"
dev = "luajit ./src/main.lua \"$@\""

[[dependencies]]
name = "hydronium/core"
constraint = "path:../core"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/ink"
constraint = "path:../ink"
registry = "path"
role = "runtime"

# JSON. This repo's only real JSON *decoder* lives in the router package
# (`hydronium_router.history.state` -- despite the name, its own doc
# comment calls it a "JSON-shaped ... codec", and it is a zero-require
# leaf module, so depending on it pulls in no router machinery at
# runtime). Reused rather than duplicating a 200-line strict parser into
# this package; see src/event_model.lua's own note.
#
# NOTE (restored 2026-09-23): `moon add`/`moon remove` rewrite this file's
# `[[dependencies]]` table wholesale and do not preserve comments attached
# to individual entries -- this comment was silently dropped by an
# unrelated `moon remove moonstone/ballad` + `moon add link:...` run (see
# the moonstone/ballad entry below) and is restored here by hand.
[[dependencies]]
name = "hydronium/router"
constraint = "path:../router"
registry = "path"
role = "runtime"

# hydronium/cli genuinely needs moonstone/ballad in BOTH roles: `tool` for
# this package's own `package` script above (`ballad play partiture.lua`,
# needs the `ballad` binary on PATH -- pre-existing, unrelated to
# `hydronium build`), and `runtime` because `hydronium build`
# (src/build_runner.lua) requires("ballad.partiture") IN-PROCESS -- it runs
# a project's declared partiture itself rather than spawning `ballad` as a
# subprocess and scraping its stdout. moon's manifest format has no way to
# attach two roles to one dependency entry (DependencyRole is a
# single-valued enum in moonstone's own source, src/core/domain/
# dependency_role.zig) -- checked, not guessed: two `[[dependencies]]`
# entries with the SAME name and DIFFERENT roles is the real supported
# mechanism (verified: the resulting moonstone.lock records
# `roles = ["tool", "runtime"]` for the one resolved package, the `ballad`
# binary lands on PATH via the `tool` entry, AND
# require("ballad.pipeline") resolves via the `runtime` entry).
#
# Ballad 0.3.13 (published during this work) supplies the M0 node events
# and cooperative checkpoints build_runner's in-process progress view
# consumes -- an ordinary version-gated registry dependency, not a local
# `link:` override.
[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.13"
role = "tool"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.13"
role = "runtime"

# `hydronium build` (src/build_runner.lua, src/build_verify.lua) requires
# the ballad plugins a real project partiture declares
# (`require("hydronium_ballad")`, e.g. examples/spa_hash_demo/partiture.lua)
# to be resolvable from THIS package's own LUA_PATH -- it runs the
# partiture in-process, not by spawning `ballad` as a project-local tool.
[[dependencies]]
name = "hydronium/ballad"
constraint = "path:../build"
registry = "path"
role = "runtime"
