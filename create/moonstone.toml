manifest_version = 2

[package]
name = "hydronium/create"
version = "0.5.0"
kind = "bin"
description = "Starter project generator and scaffolding tool for Hydronium reactive applications"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
test = "lua ./tests/create_spec.lua"
dev = "lua ./src/main.lua \"$@\""
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.0"
role = "tool"

[[dependencies]]
name = "moonstone/alter"
constraint = "^0.2.0"
role = "runtime"

[[dependencies]]
name = "moonstone/alter-jsonc"
constraint = "^0.2.0"
role = "runtime"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.7.0"
role = "runtime"

# Hydronium Ink Lab stories for the create wizard's UI
# (src/create/ui/*.lua, discovered via the repo-root hydronium.lab.lua) --
# NOT needed by the scaffolding CLI itself (main.lua/wizard.lua never
# require any of these), only by `hydronium-lab` when it loads
# create/src/create/ui/create.stories.lua. `path:../X` mirrors
# hydronium/cli's own moonstone.toml, which depends on hydronium/core and
# hydronium/ink the same way for the identical reason (its own
# `*.stories.lua` files under cli/src/ui/).
[[dependencies]]
name = "hydronium/core"
constraint = "path:../core"
registry = "path"
role = "dev"

[[dependencies]]
name = "hydronium/ink"
constraint = "path:../ink"
registry = "path"
role = "dev"

[[dependencies]]
name = "hydronium/lab"
constraint = "path:../lab"
registry = "path"
role = "dev"
