manifest_version = 2

[package]
name = "moonstone/hydronium-create"
version = "0.3.0"
kind = "bin"
description = "Starter project generator and scaffolding tool for Hydronium reactive applications"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
test = "lua ./tests/create_spec.lua"
dev = "lua ./src/main.lua \"$@\""
package = "moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.7"
role = "tool"

[[dependencies]]
name = "moonstone/alter"
constraint = "^0.1.1"
role = "runtime"

[[dependencies]]
name = "moonstone/alter-jsonc"
constraint = "^0.1.1"
role = "runtime"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.4.0"
role = "runtime"
