manifest_version = 2

[package]
name = "hydronium/create"
version = "0.5.1"
kind = "bin"
description = "Starter project generator and scaffolding tool for Hydronium reactive applications"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
test = "lua ./tests/create_spec.lua"
dev = "lua ./src/main.lua \"$@\""
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.0"
role = "tool"

[[dependencies]]
name = "moonstone/alter"
constraint = "^0.2.0"
role = "runtime"

[[dependencies]]
name = "moonstone/alter-jsonc"
constraint = "^0.2.0"
role = "runtime"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.7.0"
role = "runtime"

# Core and Ink runtime dependencies for the interactive CLI wizard (src/create/ui/*),
# mounted by main.lua whenever running interactively in a TTY.
[[dependencies]]
name = "hydronium/core"
constraint = "path:../core"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/ink"
constraint = "path:../ink"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/oklab-utils"
constraint = "path:../oklab-utils"
registry = "path"
role = "runtime"

# Hydronium Ink Lab stories for the create wizard's UI
# (src/create/ui/*.stories.lua, discovered via repo-root hydronium.lab.lua)
[[dependencies]]
name = "hydronium/lab"
constraint = "path:../lab"
registry = "path"
role = "dev"
