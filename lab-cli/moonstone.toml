manifest_version = 2

[package]
name = "hydronium/lab-cli"
version = "0.3.0"
kind = "bin"
description = "Host-neutral Hydronium Lab launcher with explicit host adapters"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
test = "moon exec -- luajit tests/runner_spec.lua"
dev = "moon exec -- luajit src/main.lua"
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.7.0"
role = "runtime"

[[dependencies]]
name = "moonstone/valua"
constraint = "^0.3.0"
role = "runtime"

[[dependencies]]
name = "luafilesystem"
constraint = "^1.8.0-1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.0"
role = "tool"
