manifest_version = 2

[package]
name = "hydronium/create"
version = "0.1.0"
kind = "bin"
description = "Starter project generator and scaffolding tool for Hydronium reactive applications"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
test = "lua ./tests/create_spec.lua"
dev = "lua ./src/main.lua \"$@\""

[[dependencies]]
name = "moonstone/alter"
constraint = "^0.1.1"
role = "runtime"

[[dependencies]]
name = "moonstone/alter-jsonc"
constraint = "^0.1.1"
role = "runtime"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.2.0"
role = "runtime"
