manifest_version = 2

[package]
name = "moonstone/hydronium-workspace"
version = "0.1.0"
kind = "script"
description = "Hydronium workspace: core, DOM host/SSR, and LUAX compiler"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.7"
role = "tool"

[[orbits.member]]
name = "core"
path = "core"

[[orbits.member]]
name = "luax"
path = "luax"

[[orbits.member]]
name = "dom"
path = "dom"

[[orbits.member]]
name = "ink"
path = "ink"

[[orbits.member]]
name = "ballad"
path = "build"

[[orbits.member]]
name = "create"
path = "create"
