name: Publish Hydronium

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish after a publish-only failure.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml
    with:
      release_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

  publish:
    needs: validate
    name: Publish Hydronium registry packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          # Includes artifact export and target-profile lock validation fixes
          # required by this multi-package workspace.
          # v0.5.9+ mounts libexec namespaced, which the scaffolds rely on.
          ref: v0.5.9
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          path: .ci/ballad
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum file jq libsqlite3-dev luajit neovim pkg-config zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Verify Moonstone artifact export support
        run: moon artifact create --help
      - name: Synchronize Hydronium workspace and package locks
        run: |
          moon sync --update
          # Read the member list from moonstone.toml rather than hardcoding it.
          # The hardcoded list said 8; the manifest declares 16, and the drift
          # is what made CI red -- an unsynced member's lock has no profile for
          # this runner's target, so `moon orbit sync --locked` fails on the
          # first one the graph reaches. Maintaining the list by hand means it
          # re-breaks every time a member is added, which happens often enough
          # to have happened mid-week.
          #
          # `path`, not `name`: they differ (the member named "ballad" lives in
          # build/). Plain awk, no gawk extensions, so it behaves the same on
          # any runner image.
          orbits="$(awk '
            /^\[\[orbits\.member\]\]/ { inm = 1; next }
            /^\[/ { inm = 0 }
            inm && /^path[ \t]*=/ {
              line = $0
              sub(/^path[ \t]*=[ \t]*"/, "", line)
              sub(/"[ \t]*$/, "", line)
              print line
            }' moonstone.toml)"
          if [ -z "$orbits" ]; then
            echo "no orbit members found in moonstone.toml -- refusing to sync nothing" >&2
            exit 1
          fi
          echo "syncing orbit members:" $orbits
          for orbit in $orbits; do
            if [ ! -f "$orbit/moonstone.toml" ]; then
              echo "declared orbit member '$orbit' has no moonstone.toml" >&2
              exit 1
            fi
            (cd "$orbit" && moon sync --update)
          done
      - name: Prepare locked Ballad integration checkout
        run: |
          ballad_version="$(moon lock package get moonstone/ballad --json | jq -er '.package.version')"
          git -C .ci/ballad checkout --detach "v$ballad_version"
          ln -s "$GITHUB_WORKSPACE/.ci/ballad" "$GITHUB_WORKSPACE/../ballad"
          (cd .ci/ballad && moon sync --locked)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify Ink Lab browser distribution
        working-directory: ink-lab
        run: |
          bun install --frozen-lockfile
          bun run build
          git diff --exit-code -- src/hydronium_ink_lab/client/virtual_terminal.js src/hydronium_ink_lab/client/ink.css src/hydronium_ink_lab/client/XTERM-LICENSES.txt
      - name: Export all registry packages
        run: moon exec -- ballad play partiture.lua
      - name: Upload and publish every registry package
        env:
          GH_TOKEN: ${{ github.token }}
          MOONSTONE_TOKEN: ${{ secrets.MOONSTONE_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$MOONSTONE_TOKEN"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Hydronium $RELEASE_TAG" --generate-notes
          # Upload internal blobs and declare public visibility at creation.
          # Existing package visibility cannot be changed by publication;
          # the registry rejects a mismatch instead of bypassing step-up.
          # Every package in dist/orbit publishes on every release run, even
          # when only one of the 8 actually bumped its version -- most runs
          # will re-attempt N-1 already-published versions. The registry
          # rejects a duplicate version with 409 and the exact message
          # "Version X already exists." (registry-publish.ts); treat that
          # one message as an expected skip, not a failure, so a partial
          # version bump still ships via a normal tag push instead of
          # needing every package bumped in lockstep.
          while IFS= read -r -d '' publish_script; do
            package_dir="$(dirname "$publish_script")"
            # basename "$package_dir" is unreliable as a package label: lib
            # packages export to a trailing .../registry/ directory, so it's
            # literally "registry" for six of the eight. package.toml's own
            # name field is the actual thing being published either way.
            package_name="$(sed -n 's/^name = "\(.*\)"$/\1/p' "$package_dir/package.toml" | head -1)"
            asset="$(find "$package_dir" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tar.zst' \) -print -quit)"
            test -n "$asset"
            gh release upload "$RELEASE_TAG" "$asset" --clobber
            publish_status=0
            publish_output="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $MOONSTONE_TOKEN" \
              -F "descriptor=@$package_dir/package.toml" \
              -F "readme=@$package_dir/README.md" \
              -F "blob=@$asset" -F "visibility=public" \
              "${MOONSTONE_PUBLISH_URL:-https://registry.moonstone.sh/api/registry/v0/publish}" 2>&1)" || publish_status=$?
            if [ "$publish_status" -ne 0 ]; then
              if printf '%s' "$publish_output" | grep -q 'already exists'; then
                echo "⚠ ${package_name:-$package_dir}: already published at this version, skipping."
                continue
              fi
              printf '%s\n' "$publish_output" >&2
              exit "$publish_status"
            fi
            printf '%s\n' "$publish_output"
          done < <(find dist/orbit -type f -name publish.sh -print0 | sort -z)
