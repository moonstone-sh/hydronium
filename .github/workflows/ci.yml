name: Hydronium CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and package Hydronium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          # v0.5.3+ validates lock dependencies against the active target
          # profile, which this multi-profile workspace requires; v0.5.6+
          # installs `collect.assets` (the packages' types/ trees), which the
          # consumer scaffold gate asserts.
          ref: v0.5.7
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          path: .ci/ballad
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum file jq libsqlite3-dev luajit neovim pkg-config zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Verify Moonstone artifact export support
        run: moon artifact create --help
      - name: Synchronize Hydronium workspace and package locks
        run: |
          moon sync --update
          # Read the member list from moonstone.toml rather than hardcoding it.
          # The hardcoded list said 8; the manifest declares 16, and the drift
          # is what made CI red -- an unsynced member's lock has no profile for
          # this runner's target, so `moon orbit sync --locked` fails on the
          # first one the graph reaches. Maintaining the list by hand means it
          # re-breaks every time a member is added, which happens often enough
          # to have happened mid-week.
          #
          # `path`, not `name`: they differ (the member named "ballad" lives in
          # build/). Plain awk, no gawk extensions, so it behaves the same on
          # any runner image.
          orbits="$(awk '
            /^\[\[orbits\.member\]\]/ { inm = 1; next }
            /^\[/ { inm = 0 }
            inm && /^path[ \t]*=/ {
              line = $0
              sub(/^path[ \t]*=[ \t]*"/, "", line)
              sub(/"[ \t]*$/, "", line)
              print line
            }' moonstone.toml)"
          if [ -z "$orbits" ]; then
            echo "no orbit members found in moonstone.toml -- refusing to sync nothing" >&2
            exit 1
          fi
          echo "syncing orbit members:" $orbits
          for orbit in $orbits; do
            if [ ! -f "$orbit/moonstone.toml" ]; then
              echo "declared orbit member '$orbit' has no moonstone.toml" >&2
              exit 1
            fi
            (cd "$orbit" && moon sync --update)
          done
      - name: Prepare locked Ballad integration checkout
        run: |
          ballad_version="$(moon lock package get moonstone/ballad --json | jq -er '.package.version')"
          git -C .ci/ballad checkout --detach "v$ballad_version"
          ln -s "$GITHUB_WORKSPACE/.ci/ballad" "$GITHUB_WORKSPACE/../ballad"
          (cd .ci/ballad && moon sync --locked)
      - name: Run Hydronium tests
        run: |
          parser_dir="$RUNNER_TEMP/hydronium-parser"
          mkdir -p "$parser_dir"
          cc -fPIC -shared \
            -I luax/tree-sitter-luax/src \
            luax/tree-sitter-luax/src/parser.c \
            -o "$parser_dir/luax.so"
          export XDG_DATA_HOME="$RUNNER_TEMP/hydronium-xdg-data"
          mkdir -p "$XDG_DATA_HOME/nvim/site/parser"
          cp "$parser_dir/luax.so" "$XDG_DATA_HOME/nvim/site/parser/luax.so"
          moon exec -- luajit tests/runner.lua
      - name: Export all registry packages
        run: moon exec -- ballad play partiture.lua

      # This is intentionally downstream of the artifact export, rather than
      # another source-tree example test.  It creates a disposable file
      # registry from dist/orbit, installs hydronium/create from that registry,
      # scaffolds an islands app, locks it, builds it, and drives the resulting
      # server in Chromium.  A green unit suite cannot substitute for this:
      # missing exports and browser-only blank pages both pass source tests.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install browser-gate dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for consumer gate
        working-directory: js
        run: pnpm exec playwright install --with-deps chromium
      - name: Published consumer scaffold gate
        env:
          MOON_BIN: ${{ github.workspace }}/.ci/moonstone/zig-out/bin/moon
          HYDRONIUM_BROWSER_GATE: node --test js/tests/consumer_scaffold.browser.test.mjs
        run: bash tests/e2e/consumer_scaffold.sh
      - name: Published query + virtual + table consumer gate
        env:
          MOON_BIN: ${{ github.workspace }}/.ci/moonstone/zig-out/bin/moon
        run: bash tests/e2e/data_primitives_consumer.sh
      - name: Static SPA browser gate
        run: |
          (cd examples/spa_hash_demo && moon exec -- ballad play partiture.lua)
          node --test js/tests/spa_hash_demo.browser.test.mjs
      - name: Meteorite + Vite production and dual-HMR gates
        env:
          MOON_BIN: ${{ github.workspace }}/.ci/moonstone/zig-out/bin/moon
        run: bash tests/e2e/meteorite_vite_browser.sh

  # The JS/CSS adapter (hydronium/js -- @hydronium-js/dom-client, @hydronium-js/vite)
  # shares no toolchain with `validate` above: no zig, no moonstone, no ballad.
  # Kept as its own job so it runs in parallel and a failure names the right
  # half of the codebase. Before this job existed, NOTHING mechanically checked
  # any of it -- the client runtime could drift from the copy `dom/` actually
  # serves, or a browser-side HMR regression could land, and CI would stay
  # green. See docs/HYDRONIUM_WEB_VITE_ADAPTER_PLAN.md.
  web:
    name: Test the web-asset adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0 (its own engines field).
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      # These three need no install at all -- they import only source paths
      # and `node:` builtins -- so run them first for a fast, cheap failure.
      - name: Client runtime tests (no install required)
        run: node --test tests/client/*.test.mjs
      - name: Dev-server supervisor tests (no install required)
        run: node --test js/packages/vite/tests/supervisor.test.mjs
      - name: dom-client drift check
        # Fails when dom/src/hydronium_dom/client/ has diverged from the
        # @hydronium-js/dom-client package it is generated from. Exits 1 on drift.
        run: node js/scripts/check-dom-client-drift.mjs

      - name: Install web workspace
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build @hydronium-js/vite
        # pnpm does NOT run a workspace package's `prepare` on install, so the
        # compiled output the plugin is consumed through does not exist until
        # this runs. Without it `vite build` in the example cannot resolve
        # @hydronium-js/vite at all on a fresh checkout.
        working-directory: js
        run: pnpm build
      - name: Plugin unit tests
        run: node --test js/packages/vite/tests/plugin.test.mjs
      - name: Install Chromium for browser gates
        working-directory: js
        run: pnpm exec playwright install --with-deps chromium
      - name: Standalone browser behavior gates
        run: |
          node --test js/tests/router_hash_history.browser.test.mjs
          node --test js/tests/overlay.browser.test.mjs
          node --test js/tests/virtual.browser.test.mjs

      - name: Tailwind + build-manifest gate
        working-directory: js/examples/islands-tailwind
        run: node --test tests/tailwind-source.test.mjs
      # NOTE: the M3 production gate and the dual-HMR gate are NOT run here.
      # Both need a compiled Meteorite binary (zig + moonstone + ballad, i.e.
      # the `validate` job's whole toolchain) plus, for M3, a ballad merge step.
      # Wiring that into CI means joining the two jobs; until then they are
      # documented pre-release gates -- see their own file headers for the
      # exact commands.
      - name: Browser HMR gate
        # Spawns a real `vite dev`, drives real Chromium, edits an island on
        # disk, and asserts window.__bootId is unchanged -- i.e. that Vite
        # HMR-patched rather than full-reloaded.
        working-directory: js/examples/islands-tailwind
        run: node --test tests/hmr.test.mjs
