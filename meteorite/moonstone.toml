manifest_version = 2

[package]
name = "hydronium/meteorite"
version = "0.1.0"
kind = "lib"
description = "Meteorite development-host integration for Hydronium Lab"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec -- ballad play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.7"
role = "tool"

[[dependencies]]
name = "hydronium/lab"
constraint = "path:../lab"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/ink-lab"
constraint = "path:../ink-lab"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/dom"
constraint = "path:../dom"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/luax"
constraint = "path:../luax"
registry = "path"
role = "runtime"

# The adapter accepts JSON session operations through Meteorite's Context API.
# `cjson` therefore belongs to the served application's runtime closure rather
# than relying on Meteorite's own tool-only dependency scope.
[[dependencies]]
name = "lua-cjson"
constraint = "^2.1.0.10-1"
registry = "rocks"
role = "runtime"
