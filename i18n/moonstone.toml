manifest_version = 2

[package]
name = "hydronium/i18n"
version = "0.1.0"
kind = "lib"
description = "Compiled Inlang messages and explicit locale contexts for Lua and JavaScript"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
package = "moon exec -- ballad play partiture.lua"
test = "bun tests/contracts.mjs"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.2"
role = "tool"
