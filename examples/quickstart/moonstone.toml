manifest_version = 2

[package]
name = "hydronium-quickstart"
version = "0.1.0"
kind = "bin"
description = "Full-stack SSR application powered by Hydronium and Meteorite"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
build = "moon exec -- ballad play build.partiture.lua && moon exec --dev -- meteorite build --mode release-hybrid --backend fast_http --lua-root .moonstone/env/libexec/luajit"
dev = "sh dev.sh"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.0"
role = "tool"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.6.2"
role = "tool"

[[dependencies]]
name = "moonstone/meteorite"
constraint = "^0.3.1"
role = "tool"

[[dependencies]]
name = "hydronium/core"
constraint = "path:../../core"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/dom"
constraint = "path:../../dom"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/luax"
constraint = "path:../../luax"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/router"
constraint = "path:../../router"
registry = "path"
role = "runtime"

[[dependencies]]
name = "hydronium/ballad"
constraint = "path:../../build"
registry = "path"
role = "runtime"
