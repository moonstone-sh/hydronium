manifest_version = 2

[package]
name = "hydronium-meteorite-ssr-example"
version = "0.1.0"
kind = "script"
description = "Real, compiled Meteorite SSR vertical slice for Hydronium"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[scripts]
"graph" = "moon exec --dev meteorite graph src/main.lua .meteorite/graph/current release-hybrid fast_http"
"package" = "moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "moonstone/meteorite"
constraint = "path:../../../meteorite"
role = "tool"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.0"
role = "tool"

[[dependencies]]
name = "moonstone/hydronium-ballad"
constraint = "path:../../build"
registry = "path"
role = "runtime"

[[dependencies]]
name = "moonstone/hydronium"
constraint = "path:../../core"
registry = "path"
role = "runtime"

[[dependencies]]
name = "moonstone/hydronium-luax"
constraint = "path:../../luax"
registry = "path"
role = "runtime"

[[dependencies]]
name = "moonstone/hydronium-dom"
constraint = "path:../../dom"
registry = "path"
role = "runtime"
