  <script type="module">
    import { LuaFactory } from "https://cdn.jsdelivr.net/npm/wasmoon@1.16.0/+esm";

    const EMBEDDED_MODULES = {"hydronium.core.symbols": "--[[\n  Hydronium Core Symbols\n  Unique symbols and tokens for internal tagging and VNode type identification.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal unpack = table.unpack or unpack\n\nlocal symbols = {}\n\nlocal function createSymbol(name)\n  local sym = {\n    __hydronium_symbol = true,\n    name = name,\n  }\n  setmetatable(sym, {\n    __tostring = function()\n      return \"Hydronium.Symbol(\" .. name .. \")\"\n    end,\n    __eq = function(a, b)\n      return type(a) == \"table\" and type(b) == \"table\" and a.name == b.name and a.__hydronium_symbol == true and b.__hydronium_symbol == true\n    end,\n  })\n  return sym\nend\n\nsymbols.VNODE = createSymbol(\"VNODE\")\nsymbols.ELEMENT = createSymbol(\"ELEMENT\")\nsymbols.COMPONENT = createSymbol(\"COMPONENT\")\nsymbols.FRAGMENT = createSymbol(\"FRAGMENT\")\nsymbols.TEXT = createSymbol(\"TEXT\")\nsymbols.BOUNDARY = createSymbol(\"BOUNDARY\")\nsymbols.INTRINSIC = createSymbol(\"INTRINSIC\")\nsymbols.SUSPENSE = createSymbol(\"SUSPENSE\")\nsymbols.ISLAND = createSymbol(\"ISLAND\")\nsymbols.SCRIPT = createSymbol(\"SCRIPT\")\n-- Marks a `hydronium.dom` descriptor as an island/script authoring\n-- primitive rather than an ordinary HTML/SVG intrinsic -- see\n-- hydronium/dom/init.lua. Distinct from symbols.INTRINSIC so `d.lua`/`d.js`\n-- cannot be mistaken for a real (fake) `<lua>`/`<js>` HTML element.\nsymbols.ISLAND_DESCRIPTOR = createSymbol(\"ISLAND_DESCRIPTOR\")\nsymbols.SCRIPT_DESCRIPTOR = createSymbol(\"SCRIPT_DESCRIPTOR\")\n\nsymbols.SCOPE = createSymbol(\"SCOPE\")\nsymbols.CONTEXT = createSymbol(\"CONTEXT\")\nsymbols.REF = createSymbol(\"REF\")\n\nsymbols.SIGNAL = createSymbol(\"SIGNAL\")\nsymbols.COMPUTED = createSymbol(\"COMPUTED\")\nsymbols.EFFECT = createSymbol(\"EFFECT\")\n\nfunction symbols.isSymbol(val)\n  return type(val) == \"table\" and val.__hydronium_symbol == true\nend\n\nfunction symbols.isType(val, symbol)\n  return val == symbol or (symbols.isSymbol(val) and symbols.isSymbol(symbol) and val.name == symbol.name)\nend\n\nreturn symbols\n", "hydronium.core.errors": "--[[\n  Hydronium Error Handling & Diagnostic Boundary\n  Structured phase errors, component stack tracing, and resilient ErrorBoundary.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal symbols = require(\"hydronium.core.symbols\")\n\nlocal unpack = table.unpack or unpack\n\nlocal errors = {}\n\nlocal HydroniumError = {}\nHydroniumError.__index = HydroniumError\n\nfunction HydroniumError.new(phase, message, originalError, componentStack)\n  local self = setmetatable({}, HydroniumError)\n  self.isHydroniumError = true\n  self.phase = phase or \"unknown\"\n  self.message = tostring(message or originalError or \"An unknown error occurred\")\n  self.originalError = originalError\n  self.componentStack = componentStack or {}\n  return self\nend\n\nfunction HydroniumError:formatComponentStack()\n  if type(self.componentStack) == \"string\" then\n    return self.componentStack\n  end\n  if type(self.componentStack) == \"table\" and #self.componentStack > 0 then\n    local lines = {}\n    for i = 1, #self.componentStack do\n      table.insert(lines, \"    at \" .. tostring(self.componentStack[i]))\n    end\n    return table.concat(lines, \"\\n\")\n  end\n  return \"\"\nend\n\nfunction HydroniumError:__tostring()\n  local stackStr = self:formatComponentStack()\n  local out = string.format(\"[Hydronium %s Error]: %s\", string.upper(self.phase), self.message)\n  if stackStr ~= \"\" then\n    out = out .. \"\\nComponent Stack:\\n\" .. stackStr\n  end\n  if self.originalError and tostring(self.originalError) ~= self.message then\n    out = out .. \"\\nCaused by: \" .. tostring(self.originalError)\n  end\n  return out\nend\n\nerrors.HydroniumError = HydroniumError\n\nfunction errors.isHydroniumError(err)\n  return type(err) == \"table\" and err.isHydroniumError == true\nend\n\nfunction errors.wrapPhaseError(phase, err, componentName, stack)\n  if errors.isHydroniumError(err) then\n    if componentName then\n      table.insert(err.componentStack, 1, componentName)\n    end\n    return err\n  end\n\n  local componentStack = {}\n  if componentName then\n    table.insert(componentStack, componentName)\n  end\n  if stack then\n    if type(stack) == \"table\" then\n      for i = 1, #stack do\n        table.insert(componentStack, stack[i])\n      end\n    else\n      table.insert(componentStack, tostring(stack))\n    end\n  end\n\n  return HydroniumError.new(phase, tostring(err), err, componentStack)\nend\n\n--- ErrorBoundary Component\n--- Props:\n---   fallback: function(err, retry) or VNode\n---   onError: function(err) [optional]\n---   children: child nodes\nfunction errors.ErrorBoundary(props)\n  -- The ErrorBoundary itself is treated specially by the reconciler/component runtime.\n  -- Returning a marker table allowing the reconciler to establish boundary semantics.\n  return {\n    _typeof = symbols.VNODE,\n    kind = symbols.BOUNDARY,\n    tag = errors.ErrorBoundary,\n    props = props or {},\n    children = props and props.children or {},\n  }\nend\n\nreturn errors\n", "hydronium.core.scheduler": "--[[\n  Hydronium Scheduler & Reentrancy Defenses\n  Phased execution pipeline (Mutation -> Render -> Commit -> Effect),\n  batching, cycle detection, and render-phase mutation defenses.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal errors = require(\"hydronium.core.errors\")\n\nlocal unpack = table.unpack or unpack\n\nlocal scheduler = {}\n\nlocal currentRenderingComponent = nil\nlocal isRenderingFlag = false\nlocal isCommittingFlag = false\nlocal isFlushingEffectsFlag = false\nlocal isFlushingFlag = false\nlocal isSSRFlag = false\nlocal batchDepth = 0\n\nlocal renderQueue = {}\nlocal renderSet = {}\n\nlocal effectQueue = {}\nlocal effectSet = {}\n\nlocal effectSignalQueue = {}\n\nlocal componentStack = {}\n\nlocal MAX_FLUSH_ITERATIONS = 100\n\nfunction scheduler.isRendering()\n  return isRenderingFlag\nend\n\nfunction scheduler.getCurrentRenderingComponent()\n  return currentRenderingComponent\nend\n\nfunction scheduler.setCurrentRenderingComponent(comp)\n  currentRenderingComponent = comp\n  isRenderingFlag = comp ~= nil\nend\n\nfunction scheduler.isCommitting()\n  return isCommittingFlag\nend\n\nfunction scheduler.setCommitting(val)\n  isCommittingFlag = val == true\nend\n\nfunction scheduler.isFlushingEffects()\n  return isFlushingEffectsFlag\nend\n\nfunction scheduler.setFlushingEffects(val)\n  isFlushingEffectsFlag = val == true\nend\n\nfunction scheduler.isSSR()\n  return isSSRFlag\nend\n\nfunction scheduler.setSSR(val)\n  isSSRFlag = val == true\nend\n\nfunction scheduler.setSSRMode(val)\n  isSSRFlag = val == true\nend\n\nfunction scheduler.isBatching()\n  return batchDepth > 0\nend\n\nfunction scheduler.startBatch()\n  batchDepth = batchDepth + 1\nend\n\nfunction scheduler.endBatch()\n  if batchDepth > 0 then\n    batchDepth = batchDepth - 1\n    if batchDepth == 0 then\n      scheduler.flush()\n    end\n  end\nend\n\nfunction scheduler.cancelBatch()\n  if batchDepth > 0 then\n    batchDepth = batchDepth - 1\n    -- Discard any pending updates created during failed batch\n    effectSignalQueue = {}\n  end\nend\n\nfunction scheduler.pushComponentStack(name)\n  table.insert(componentStack, name or \"Anonymous\")\nend\n\nfunction scheduler.popComponentStack()\n  if #componentStack > 0 then\n    table.remove(componentStack)\n  end\nend\n\nfunction scheduler.getComponentStack()\n  local copy = {}\n  for i = 1, #componentStack do\n    table.insert(copy, componentStack[i])\n  end\n  return copy\nend\n\nfunction scheduler.scheduleRender(component)\n  if isSSRFlag then\n    return\n  end\n  if not component or component.isMounted == false then\n    return\n  end\n  if not renderSet[component] then\n    renderSet[component] = true\n    table.insert(renderQueue, component)\n  end\n\n  if not scheduler.isBatching() and not scheduler.isRendering() and not isFlushingEffectsFlag and not isFlushingFlag then\n    scheduler.flush()\n  end\nend\n\nfunction scheduler.queueEffect(effect)\n  if isSSRFlag then\n    return\n  end\n  if not effect or effect.isDisposed then\n    return\n  end\n  if not effectSet[effect] then\n    effectSet[effect] = true\n    table.insert(effectQueue, effect)\n  end\n\n  if not scheduler.isBatching() and not scheduler.isRendering() and not isFlushingEffectsFlag and not isFlushingFlag then\n    scheduler.flush()\n  end\nend\n\n--- Queue signal updates originating from within effects.\n--- Complies with Amendment 3: ensures Effect phase finishes before next Render phase begins.\nfunction scheduler.queueEffectSignal(fn)\n  table.insert(effectSignalQueue, fn)\nend\n\nlocal function sortRenderQueue()\n  table.sort(renderQueue, function(a, b)\n    local da = a.depth or 0\n    local db = b.depth or 0\n    return da < db\n  end)\nend\n\n--- Flush all pending updates through the phased pipeline:\n--- 1. Render phase (re-render dirty components)\n--- 2. Commit phase (apply tree mutations)\n--- 3. Effect phase (run scheduled effects)\n--- 4. Deferred signal updates from effects -> loop if needed\nfunction scheduler.flush()\n  if isFlushingFlag then\n    return\n  end\n  isFlushingFlag = true\n\n  local ok, flushErr = pcall(function()\n    local iterations = 0\n\n    while (#renderQueue > 0 or #effectQueue > 0 or #effectSignalQueue > 0) do\n      iterations = iterations + 1\n      if iterations > MAX_FLUSH_ITERATIONS then\n        renderQueue = {}\n        renderSet = {}\n        effectQueue = {}\n        effectSet = {}\n        effectSignalQueue = {}\n        error(\"Cycle detected: maximum reactive update depth exceeded\", 0)\n      end\n\n      -- Phase 1 & 2: Render & Commit Phase\n      while #renderQueue > 0 do\n        sortRenderQueue()\n        local currentQueue = renderQueue\n        local currentSet = renderSet\n        renderQueue = {}\n        renderSet = {}\n\n        for i = 1, #currentQueue do\n          local comp = currentQueue[i]\n          if comp.isMounted and comp.isDirty then\n            comp:update()\n          end\n        end\n      end\n\n      -- Phase 3: Effect Phase\n      if #effectQueue > 0 then\n        local currentEffects = effectQueue\n        effectQueue = {}\n        effectSet = {}\n\n        scheduler.setFlushingEffects(true)\n        for i = 1, #currentEffects do\n          local eff = currentEffects[i]\n          if not eff.isDisposed then\n            eff:execute()\n          end\n        end\n        scheduler.setFlushingEffects(false)\n      end\n\n      -- Phase 4: Apply queued signal updates from effects\n      if #effectSignalQueue > 0 then\n        local currentSignalUpdates = effectSignalQueue\n        effectSignalQueue = {}\n        for i = 1, #currentSignalUpdates do\n          local updateFn = currentSignalUpdates[i]\n          local uOk, uErr = pcall(updateFn)\n          if not uOk then\n            error(errors.wrapPhaseError(\"effect\", uErr), 0)\n          end\n        end\n      end\n    end\n  end)\n\n  isFlushingFlag = false\n\n  if not ok then\n    error(flushErr, 0)\n  end\nend\n\nscheduler.flushSync = scheduler.flush\n\nreturn scheduler\n", "hydronium.signals.graph": "--[[\n  Hydronium Reactive Dependency Graph\n  Fine-grained Publisher-Subscriber graph with dynamic dependency tracking,\n  transactional updates, and protected observer evaluation.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal unpack = table.unpack or unpack\n\nlocal graph = {}\n\nlocal trackingStack = {}\nlocal currentObserver = nil\n\nfunction graph.getCurrentObserver()\n  return currentObserver\nend\n\nfunction graph.isTracking()\n  return currentObserver ~= nil\nend\n\nfunction graph.pushObserver(obs)\n  table.insert(trackingStack, obs)\n  currentObserver = obs\nend\n\nfunction graph.popObserver()\n  if #trackingStack > 0 then\n    table.remove(trackingStack)\n    currentObserver = trackingStack[#trackingStack]\n  else\n    currentObserver = nil\n  end\nend\n\n--- Execute a function without reactive tracking.\nfunction graph.untrack(fn, ...)\n  local prevStack = trackingStack\n  local prevObserver = currentObserver\n  trackingStack = {}\n  currentObserver = nil\n\n  local args = { ... }\n  local n = select(\"#\", ...)\n  local ok, res1, res2, res3 = pcall(function()\n    return fn(unpack(args, 1, n))\n  end)\n\n  trackingStack = prevStack\n  currentObserver = prevObserver\n\n  if not ok then\n    error(res1, 0)\n  end\n  return res1, res2, res3\nend\n\n--- Connect a source (Signal or Computed) to the currently active observer.\nfunction graph.trackSource(source)\n  if currentObserver and not currentObserver.isDisposed then\n    source.subscribers[currentObserver] = true\n    currentObserver.sources[source] = true\n  end\nend\n\n--- Clear all existing source dependencies from an observer before re-evaluation.\nfunction graph.cleanupObserverSources(obs)\n  if obs.sources then\n    for source in pairs(obs.sources) do\n      if source.subscribers then\n        source.subscribers[obs] = nil\n      end\n    end\n    obs.sources = {}\n  end\nend\n\n--- Protected observer evaluation with strict stack restoration.\n--- Complies with Amendment 5: ensures tracking stack is ALWAYS restored on error!\nfunction graph.runObserver(obs, fn, ...)\n  graph.cleanupObserverSources(obs)\n  graph.pushObserver(obs)\n\n  local args = { ... }\n  local n = select(\"#\", ...)\n  local ok, res1, res2, res3 = pcall(function()\n    return fn(unpack(args, 1, n))\n  end)\n\n  graph.popObserver()\n\n  if not ok then\n    error(res1, 0)\n  end\n  return res1, res2, res3\nend\n\nreturn graph\n", "hydronium.signals.signal": "--[[\n  Hydronium Signal Primitive\n  Fine-grained reactive state container with render-phase mutation guard,\n  effect-deferred subscriber scheduling, and dual-style API accessors.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal symbols = require(\"hydronium.core.symbols\")\nlocal errors = require(\"hydronium.core.errors\")\nlocal scheduler = require(\"hydronium.core.scheduler\")\nlocal graph = require(\"hydronium.signals.graph\")\n\nlocal unpack = table.unpack or unpack\n\nlocal signalModule = {}\n\nlocal function defaultEquals(a, b)\n  return a == b\nend\n\nlocal function notifySubscribers(source)\n  local subs = {}\n  for sub in pairs(source.subscribers) do\n    table.insert(subs, sub)\n  end\n\n  for i = 1, #subs do\n    local sub = subs[i]\n    if not sub.isDisposed then\n      if sub.notify then\n        sub:notify(source)\n      elseif sub.markDirty then\n        sub:markDirty()\n      end\n    end\n  end\nend\n\nfunction signalModule.createSignal(initialValue, options)\n  local equals = defaultEquals\n  if options and options.equals ~= nil then\n    if options.equals == false then\n      equals = function() return false end\n    elseif type(options.equals) == \"function\" then\n      equals = options.equals\n    end\n  end\n\n  local signal = {\n    _typeof = symbols.SIGNAL,\n    value = initialValue,\n    subscribers = {},\n    name = options and options.name or \"Signal\",\n    equals = equals,\n  }\n\n  local accessor = {}\n\n  local function getter()\n    graph.trackSource(signal)\n    return signal.value\n  end\n\n  local function setter(...)\n    local n = select(\"#\", ...)\n    local newVal\n    if n >= 2 and select(1, ...) == accessor then\n      newVal = select(2, ...)\n    else\n      newVal = select(1, ...)\n    end\n\n    local resolvedVal = newVal\n    if type(newVal) == \"function\" then\n      resolvedVal = newVal(signal.value)\n    end\n\n    if equals(signal.value, resolvedVal) then\n      return signal.value\n    end\n\n    -- Amendment 3: Render-phase mutation guard\n    if scheduler.isRendering() then\n      local comp = scheduler.getCurrentRenderingComponent()\n      local compName = comp and (comp.name or \"Component\") or \"Component\"\n      local err = errors.wrapPhaseError(\n        \"render\",\n        string.format(\n          \"ERR_RENDER_MUTATION: Cannot update signal '%s' during render phase of component '%s'. Render functions must be pure.\",\n          signal.name,\n          compName\n        ),\n        compName,\n        scheduler.getComponentStack()\n      )\n      error(tostring(err), 0)\n    end\n\n    -- Amendment 3: Queue signal updates from effects safely\n    if scheduler.isFlushingEffects() then\n      signal.value = resolvedVal\n      scheduler.queueEffectSignal(function()\n        notifySubscribers(signal)\n      end)\n      return signal.value\n    end\n\n    signal.value = resolvedVal\n\n    if scheduler.isBatching() then\n      notifySubscribers(signal)\n    else\n      notifySubscribers(signal)\n      scheduler.flush()\n    end\n\n    return signal.value\n  end\n\n  local function methodGetter(...)\n    return getter()\n  end\n\n  local function methodSetter(self_or_val, maybeVal)\n    if self_or_val == accessor then\n      return setter(maybeVal)\n    else\n      return setter(self_or_val)\n    end\n  end\n\n  accessor.get = methodGetter\n  accessor.set = methodSetter\n  accessor.tuple = function() return getter, setter end\n  accessor._signal = signal\n  accessor._is_signal = true\n\n  setmetatable(accessor, {\n    __index = function(t, k)\n      if k == 1 then\n        return getter\n      elseif k == 2 then\n        return setter\n      end\n      return rawget(t, k)\n    end,\n    __call = function(t, ...)\n      local n = select(\"#\", ...)\n      if n == 0 then\n        return getter()\n      else\n        return setter(...)\n      end\n    end,\n    __tostring = function()\n      return string.format(\"Signal(%s)\", tostring(signal.value))\n    end,\n  })\n\n  return accessor, setter\nend\n\nsignalModule.signal = signalModule.createSignal\n\nreturn signalModule\n", "hydronium.signals.computed": "--[[\n  Hydronium Computed Primitive\n  Memoized derivation with lazy evaluation, fine-grained dependency tracking,\n  and protected observer execution.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal symbols = require(\"hydronium.core.symbols\")\nlocal errors = require(\"hydronium.core.errors\")\nlocal graph = require(\"hydronium.signals.graph\")\n\nlocal unpack = table.unpack or unpack\n\nlocal computedModule = {}\n\nlocal function defaultEquals(a, b)\n  return a == b\nend\n\nlocal function notifySubscribers(node)\n  local subs = {}\n  for sub in pairs(node.subscribers) do\n    table.insert(subs, sub)\n  end\n\n  for i = 1, #subs do\n    local sub = subs[i]\n    if not sub.isDisposed then\n      if sub.notify then\n        sub:notify(node)\n      elseif sub.markDirty then\n        sub:markDirty()\n      end\n    end\n  end\nend\n\nfunction computedModule.createComputed(fn, options)\n  local equals = defaultEquals\n  if options and options.equals ~= nil then\n    if options.equals == false then\n      equals = function() return false end\n    elseif type(options.equals) == \"function\" then\n      equals = options.equals\n    end\n  end\n\n  local node = {\n    _typeof = symbols.COMPUTED,\n    _is_computed = true,\n    fn = fn,\n    value = nil,\n    isDirty = true,\n    isDisposed = false,\n    sources = {},\n    subscribers = {},\n    name = options and options.name or \"Computed\",\n  }\n\n  function node:markDirty()\n    if not self.isDirty then\n      self.isDirty = true\n      notifySubscribers(self)\n    end\n  end\n\n  function node:notify()\n    self:markDirty()\n  end\n\n  function node:dispose()\n    if self.isDisposed then return end\n    self.isDisposed = true\n    graph.cleanupObserverSources(self)\n    self.subscribers = {}\n  end\n\n  local function evaluate()\n    if node.isDirty then\n      -- Re-evaluate with transactional protected observer tracking (Amendment 5)\n      local ok, res = pcall(function()\n        return graph.runObserver(node, node.fn)\n      end)\n\n      if not ok then\n        node:dispose()\n        local wrapped = errors.wrapPhaseError(\"render\", res)\n        error(tostring(wrapped), 0)\n      end\n\n      node.value = res\n      node.isDirty = false\n    end\n    return node.value\n  end\n\n  local function getter()\n    -- If being observed, link node into active observer's sources\n    graph.trackSource(node)\n    return evaluate()\n  end\n\n  local accessor = {\n    get = getter,\n    dispose = function() node:dispose() end,\n    _node = node,\n    _is_computed = true,\n  }\n\n  setmetatable(accessor, {\n    __call = function()\n      return getter()\n    end,\n    __tostring = function()\n      return string.format(\"Computed(%s)\", tostring(node.value))\n    end,\n  })\n\n  return accessor\nend\n\ncomputedModule.computed = computedModule.createComputed\n\nreturn computedModule\n", "hydronium.signals.effect": "--[[\n  Hydronium Effect Primitive\n  Side-effect runner bound to reactive scope, resilient cleanup execution,\n  and scheduler queue integration.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal symbols = require(\"hydronium.core.symbols\")\nlocal errors = require(\"hydronium.core.errors\")\nlocal scopeModule = require(\"hydronium.core.scope\")\nlocal scheduler = require(\"hydronium.core.scheduler\")\nlocal graph = require(\"hydronium.signals.graph\")\n\nlocal unpack = table.unpack or unpack\n\nlocal effectModule = {}\n\nlocal Effect = {}\nEffect.__index = Effect\n\nfunction Effect.new(fn)\n  local self = setmetatable({}, Effect)\n  self._typeof = symbols.EFFECT\n  self._is_effect = true\n  self.fn = fn\n  self.cleanupFn = nil\n  self.sources = {}\n  self.isDisposed = false\n  self.disposed = false\n  self.isRunning = false\n\n  -- Bind to current scope if available\n  local activeScope = scopeModule.getScope()\n  if activeScope then\n    activeScope:defer(function()\n      self:dispose()\n    end)\n  end\n\n  -- If SSR mode is active, suppress effect execution to prevent leaks and timers\n  if scheduler.isSSR and scheduler.isSSR() then\n    self.isDisposed = true\n    self.disposed = true\n    return self\n  end\n\n  -- Initial execution runs immediately with effect protection\n  scheduler.setFlushingEffects(true)\n  self:execute()\n  scheduler.setFlushingEffects(false)\n  scheduler.flush()\n\n  return self\nend\n\nfunction Effect:notify()\n  if not self.isDisposed then\n    scheduler.queueEffect(self)\n  end\nend\n\n--- Execute the effect callback.\n--- Complies with Amendment 2 (resilient cleanup in pcall) and Amendment 5 (protected observer).\nfunction Effect:execute()\n  if self.isDisposed or self.isRunning then\n    return\n  end\n  self.isRunning = true\n\n  -- 1. Execute previous cleanup callback in pcall\n  if self.cleanupFn then\n    local cFn = self.cleanupFn\n    self.cleanupFn = nil\n    local cOk, cErr = pcall(cFn)\n    if not cOk then\n      -- Report cleanup error without aborting effect execution\n      local wrapped = errors.wrapPhaseError(\"cleanup\", cErr)\n    end\n  end\n\n  -- 2. Run effect body with transactional tracking (Amendment 5)\n  local ok, res = pcall(function()\n    return graph.runObserver(self, self.fn)\n  end)\n\n  self.isRunning = false\n\n  if not ok then\n    self:dispose()\n    error(tostring(res), 0)\n  end\n\n  if type(res) == \"function\" then\n    self.cleanupFn = res\n  end\nend\n\nfunction Effect:run()\n  self:execute()\nend\n\nfunction Effect:dispose()\n  if self.isDisposed then\n    return\n  end\n  self.isDisposed = true\n  self.disposed = true\n\n  graph.cleanupObserverSources(self)\n\n  if self.cleanupFn then\n    local cFn = self.cleanupFn\n    self.cleanupFn = nil\n    pcall(cFn)\n  end\nend\n\nfunction effectModule.createEffect(fn)\n  return Effect.new(fn)\nend\n\neffectModule.effect = effectModule.createEffect\neffectModule.Effect = Effect\n\nreturn effectModule\n", "hydronium.signals.batch": "--[[\n  Hydronium Batch & Untrack Utilities\n  Batched mutation blocks and untracked read boundaries.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal scheduler = require(\"hydronium.core.scheduler\")\nlocal graph = require(\"hydronium.signals.graph\")\n\nlocal unpack = table.unpack or unpack\n\nlocal batchModule = {}\n\nfunction batchModule.batch(fn, ...)\n  scheduler.startBatch()\n  local args = { ... }\n  local n = select(\"#\", ...)\n  local ok, res1, res2, res3 = pcall(function()\n    return fn(unpack(args, 1, n))\n  end)\n\n  if not ok then\n    scheduler.cancelBatch()\n    error(res1, 0)\n  end\n\n  scheduler.endBatch()\n  return res1, res2, res3\nend\n\nbatchModule.untrack = graph.untrack\n\nreturn batchModule\n", "hydronium.signals": "--[[\n  Hydronium Signals Module Entry\n  Fine-grained reactive primitives: createSignal/signal, createComputed/computed,\n  createEffect/effect, batch, untrack.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n--]]\n\nlocal graph = require(\"hydronium.signals.graph\")\nlocal signal = require(\"hydronium.signals.signal\")\nlocal computed = require(\"hydronium.signals.computed\")\nlocal effect = require(\"hydronium.signals.effect\")\nlocal batch = require(\"hydronium.signals.batch\")\n\nreturn {\n  createSignal = signal.createSignal,\n  signal = signal.createSignal,\n  create_signal = signal.createSignal,\n\n  createComputed = computed.createComputed,\n  computed = computed.createComputed,\n  create_computed = computed.createComputed,\n\n  createEffect = effect.createEffect,\n  effect = effect.createEffect,\n  create_effect = effect.createEffect,\n\n  batch = batch.batch,\n  untrack = batch.untrack,\n  graph = graph,\n\n  setSSRMode = function(val)\n    local scheduler = require(\"hydronium.core.scheduler\")\n    scheduler.setSSR(val)\n  end,\n  isSSRMode = function()\n    local scheduler = require(\"hydronium.core.scheduler\")\n    return scheduler.isSSR()\n  end,\n}\n", "hydronium.core.scope": "--[[\n  Hydronium Scope System\n  Hierarchical lifetime management, resilient LIFO cleanup execution, and scope stacks.\n  Compatible with Lua 5.1, 5.2, 5.3, 5.4, and LuaJIT.\n  Does NOT rely on __gc for cleanup semantics.\n--]]\n\nlocal symbols = require(\"hydronium.core.symbols\")\nlocal errors = require(\"hydronium.core.errors\")\n\nlocal unpack = table.unpack or unpack\n\nlocal scopeModule = {}\n\nlocal scopeStack = {}\nlocal currentScope = nil\n\nlocal Scope = {}\nScope.__index = Scope\n\nlocal globalScopeCounter = 0\n\nfunction Scope.new(parent)\n  globalScopeCounter = globalScopeCounter + 1\n  local self = setmetatable({}, Scope)\n  self._typeof = symbols.SCOPE\n  self.scopeId = globalScopeCounter\n  self.parent = parent\n  self.children = {}\n  self.cleanups = {}\n  self.idCounters = {}\n  self.isDisposed = false\n\n  if parent and not parent.isDisposed then\n    table.insert(parent.children, self)\n  end\n\n  return self\nend\n\nfunction Scope:id(prefix)\n  prefix = prefix or \"id\"\n  self.idCounters[prefix] = (self.idCounters[prefix] or 0) + 1\n  return string.format(\":r%d:%s_%d\", self.scopeId, prefix, self.idCounters[prefix])\nend\n\nfunction Scope:resetIdCounters()\n  self.idCounters = {}\nend\n\nfunction Scope:defer(cleanupFn)\n  if type(cleanupFn) ~= \"function\" then\n    return\n  end\n  if self.isDisposed then\n    -- If already disposed, execute cleanup immediately in protected call\n    local ok, err = pcall(cleanupFn)\n    if not ok then\n      local wrapped = errors.wrapPhaseError(\"cleanup\", err)\n      error(tostring(wrapped), 0)\n    end\n    return\n  end\n  table.insert(self.cleanups, cleanupFn)\nend\n\nfunction Scope:createChild()\n  return Scope.new(self)\nend\n\n--- Dispose this scope and all nested children in LIFO order.\n--- Complies with Amendment 2: wrap all cleanups in pcall, collect errors, continue executing.\nfunction Scope:dispose()\n  if self.isDisposed then\n    return\n  end\n  self.isDisposed = true\n\n  local caughtErrors = {}\n\n  -- 1. Dispose children in reverse order\n  local numChildren = #self.children\n  for i = numChildren, 1, -1 do\n    local child = self.children[i]\n    if child and not child.isDisposed then\n      local ok, err = pcall(function()\n        child:dispose()\n      end)\n      if not ok then\n        table.insert(caughtErrors, err)\n      end\n    end\n  end\n  self.children = {}\n\n  -- 2. Execute registered cleanups in LIFO order\n  local numCleanups = #self.cleanups\n  for i = numCleanups, 1, -1 do\n    local fn = self.cleanups[i]\n    local ok, err = pcall(fn)\n    if not ok then\n      table.insert(caughtErrors, errors.wrapPhaseError(\"cleanup\", err))\n    end\n  end\n  self.cleanups = {}\n\n  -- 3. Detach from parent if parent is still active\n  if self.parent and not self.parent.isDisposed then\n    local pChildren = self.parent.children\n    for i = 1, #pChildren do\n      if pChildren[i] == self then\n        table.remove(pChildren, i)\n        break\n      end\n    end\n  end\n\n  -- If any cleanup failed, bubble or report errors\n  if #caughtErrors > 0 then\n    if #caughtErrors == 1 then\n      error(tostring(caughtErrors[1]), 0)\n    else\n      local msgs = {}\n      for idx, e in ipairs(caughtErrors) do\n        table.insert(msgs, string.format(\"  [%d]: %s\", idx, tostring(e)))\n      end\n      local combined = \"[Hydronium CLEANUP Error]: Multiple cleanup failures:\\n\" .. table.concat(msgs, \"\\n\")\n      error(combined, 0)\n    end\n  end\nend\n\nfunction scopeModule.createScope(fn)\n  local scope = Scope.new(currentScope)\n  if fn then\n    local res\n    local ok, err = pcall(function()\n      res = scopeModule.runWithScope(scope, fn, scope)\n    end)\n    if not ok then\n      -- If execution failed, dispose scope and rethrow\n      pcall(function() scope:dispose() end)\n      error(err, 0)\n    end\n    return res, scope\n  end\n  return scope\nend\n\nfunction scopeModule.getScope()\n  return currentScope\nend\n\nfunction scopeModule.pushScope(scope)\n  table.insert(scopeStack, scope)\n  currentScope = scope\nend\n\nfunction scopeModule.popScope()\n  if #scopeStack > 0 then\n    table.remove(scopeStack)\n    currentScope = scopeStack[#scopeStack]\n  else\n    currentScope = nil\n  end\nend\n\nfunction scopeModule.getScopeStackDepth()\n  return #scopeStack\nend\n\nfunction scopeModule.resetScopeStack(targetDepth)\n  targetDepth = targetDepth or 0\n  while #scopeStack > targetDepth do\n    table.remove(scopeStack)\n  end\n  currentScope = scopeStack[#scopeStack]\nend\n\nfunction scopeModule.runWithScope(scope, fn, ...)\n  scopeModule.pushScope(scope)\n  local args = { ... }\n  local numArgs = select(\"#\", ...)\n\n  local ok, res1, res2, res3, res4 = pcall(function()\n    return fn(unpack(args, 1, numArgs))\n  end)\n\n  scopeModule.popScope()\n\n  if not ok then\n    error(res1, 0)\n  end\n  return res1, res2, res3, res4\nend\n\nfunction scopeModule.onCleanup(fn)\n  if currentScope then\n    currentScope:defer(fn)\n  else\n    -- Outside of an active scope, onCleanup is a no-op or warns\n  end\nend\n\nscopeModule.Scope = Scope\n\nreturn scopeModule\n", "hydronium.core.refresh": "--[[\n  Hydronium HMR Refresh Registry -- design proof, v0.\n\n  Proves the structural-matching resource-identity model from\n  docs/HYDRONIUM_SCHEDULER_HMR_FOUNDATION.md against the REAL\n  hydronium.signals primitives, using hand-written {kind, name,\n  block_path} descriptors standing in for what a future LUAX compiler\n  pass would attach automatically to each `scope:signal(...)`-shaped\n  call site. This is NOT wired into the LUAX compiler, the component\n  runtime, or any dev transport -- it is a standalone proof that the\n  matching algorithm itself is sound, run against real signals, before\n  committing to building the compiler pass that would make descriptor\n  attachment automatic.\n\n  Correction found while building this: earlier design language (this\n  session's own prior document) referred to `scope:signal(initial)` as\n  Hydronium's existing API. It is not -- `hydronium.core.scope.Scope` has\n  no signal registry at all (only `Effect` ties itself to the ambient\n  scope, via `scope:defer`, for disposal). The real API is the free\n  function `hydronium.signals.createSignal(initial)`. This module wraps\n  that real function; it does not invent a new one that doesn't exist.\n\n  Design note on WHY signals are always freshly created and then\n  value-copied, never returned-by-reference across generations: the\n  matching decision for a \"rename\" candidate cannot be made until the\n  *entire* new setup run has finished (you need to see every new\n  declaration to know there's exactly one unmatched leftover on each\n  side -- see :finish_generation()). But :signal() must return something\n  valid to its caller immediately, before that information exists. So\n  every call always creates a real, fresh signal (correct immediately,\n  no special-casing at call time); finish_generation() then copies the\n  matched old value into the new signal's underlying storage in place.\n  Lua tables are references, so this mutation is visible to any closure\n  that already captured the accessor -- as long as it happens before the\n  next read, which it does (finish_generation runs immediately after the\n  setup call returns, before any render/read).\n--]]\n\nlocal signals = require(\"hydronium.signals\")\n\nlocal M = {}\n\nlocal RefreshRegistry = {}\nRefreshRegistry.__index = RefreshRegistry\n\nfunction RefreshRegistry.new()\n  return setmetatable({\n    generation = 0,\n    records = {},        -- key -> record, committed after finish_generation()\n    unmatched_old = {},  -- key -> record, old records not yet claimed this generation\n    pending_new = {},     -- key -> record, this generation's not-yet-resolved declarations\n  }, RefreshRegistry)\nend\n\nlocal function key_for(descriptor)\n  return descriptor.kind .. \"\\0\" .. descriptor.name .. \"\\0\" .. descriptor.block_path\nend\n\n--- Call once at the start of each setup run (including the very first\n--- one, which is just a refresh against an empty registry).\nfunction RefreshRegistry:begin_generation()\n  self.generation = self.generation + 1\n  self.unmatched_old = self.records\n  self.records = {}\n  self.pending_new = {}\nend\n\n--- The refresh-aware replacement for `signals.createSignal(initial)`.\n--- `descriptor = { kind = \"signal\", name = \"count\", block_path = \"...\" }`.\n--- Always returns a real, freshly-created signal -- see the module doc\n--- comment for why matching is resolved later, not here.\nfunction RefreshRegistry:signal(initial, descriptor)\n  local accessor, setter = signals.createSignal(initial)\n  local key = key_for(descriptor)\n  local rec = {\n    kind = descriptor.kind,\n    name = descriptor.name,\n    block_path = descriptor.block_path,\n    accessor = accessor,\n    setter = setter,\n  }\n  self.records[key] = rec\n  self.pending_new[key] = rec\n  return accessor, setter\nend\n\n--- Call once after the new setup run completes. Resolves matches\n--- (primary key match, then the rename heuristic for leftovers) and\n--- copies matched old values into the new signals in place.\n--- @return table report { preserved = {name,...}, renamed = {\"new -> old\",...}, created = {name,...}, disposed = {name,...} }\nfunction RefreshRegistry:finish_generation()\n  local report = { preserved = {}, renamed = {}, created = {}, disposed = {} }\n\n  -- Primary pass: exact (kind, name, block_path) match.\n  for key, new_rec in pairs(self.pending_new) do\n    local old = self.unmatched_old[key]\n    if old and old.kind == new_rec.kind then\n      new_rec.accessor._signal.value = old.accessor._signal.value\n      self.unmatched_old[key] = nil\n      self.pending_new[key] = nil\n      table.insert(report.preserved, new_rec.name)\n    end\n  end\n\n  -- Secondary pass: rename heuristic. Group whatever is left, by kind.\n  local leftover_by_kind = {}\n  for _, rec in pairs(self.unmatched_old) do\n    leftover_by_kind[rec.kind] = leftover_by_kind[rec.kind] or {}\n    table.insert(leftover_by_kind[rec.kind], rec)\n  end\n  local pending_by_kind = {}\n  for key, rec in pairs(self.pending_new) do\n    pending_by_kind[rec.kind] = pending_by_kind[rec.kind] or {}\n    table.insert(pending_by_kind[rec.kind], { key = key, rec = rec })\n  end\n\n  for kind, pendings in pairs(pending_by_kind) do\n    local leftovers = leftover_by_kind[kind]\n    if leftovers and #leftovers == 1 and #pendings == 1 then\n      -- Exactly one unmatched candidate on each side of the same kind:\n      -- a confident rename match. Never guess when there is more than\n      -- one candidate on either side -- see the `else` branch.\n      local old = leftovers[1]\n      local new_entry = pendings[1]\n      new_entry.rec.accessor._signal.value = old.accessor._signal.value\n      table.insert(report.renamed, new_entry.rec.name .. \" <- \" .. old.name)\n      self.pending_new[new_entry.key] = nil\n      leftover_by_kind[kind] = {}\n    else\n      for _, p in ipairs(pendings) do\n        table.insert(report.created, p.rec.name)\n        self.pending_new[p.key] = nil\n      end\n    end\n  end\n\n  -- Anything still unmatched on the old side was genuinely removed (or\n  -- was ambiguous and safely left unmatched rather than guessed).\n  -- hydronium.signals has no disposal concept for signals today (only\n  -- Effects are scope-disposed) -- there is nothing to explicitly clean\n  -- up here; this only exists to report what happened.\n  for kind, leftovers in pairs(leftover_by_kind) do\n    for _, rec in ipairs(leftovers) do\n      table.insert(report.disposed, rec.name)\n    end\n  end\n\n  self.unmatched_old = {}\n  self.pending_new = {}\n  return report\nend\n\nM.RefreshRegistry = RefreshRegistry\nreturn M\n", "hydronium.interpreter.lua": "--[[\n  hydronium.interpreter.lua -- the client-side Lua execution backend for\n  `d.lua.island` (see hydronium/dom/init.lua and\n  docs/HYDRONIUM_ISLANDS_SUSPENSE_V1.md). NOT the DOM authoring surface\n  itself -- `d.lua.island` is a DOM-bound descriptor selecting this\n  backend; this module is the backend it selects.\n\n  v1 scope, deliberately narrow (mission Part XXII step 4: \"one Lua WASM\n  Counter hydration proof\", not a general hydration algorithm):\n  `hydrate_counter_island` claims exactly the DOM shape a single\n  `<d.lua.island><Counter .../></d.lua.island>` SSR boundary produces --\n  one island containing one <button> -- and wires one real Hydronium\n  signal to it. There is no VNode-tree reconciliation, no arbitrary\n  component support, no re-entry into `hydronium.core.reconciler` (which\n  still has no client host for ISLAND-kind vnodes at all -- see\n  core/reconciler.lua). Building the general algorithm ahead of a second,\n  differently-shaped proof would be exactly the kind of speculative work\n  this project avoids; this function exists to be outgrown, not extended\n  in place.\n\n  Host contract (must be provided as plain Lua globals by whatever\n  embeds this WASM Lua VM -- e.g. wasmoon in a browser page -- before\n  calling into this module; see the published \"Hydronium in WASM\" proof\n  artifact for a concrete host implementation):\n\n    hy_find_island(island_id: string) -> handle | nil\n      Locate the DOM range between the `<!--hy:i:<island_id>:lua-->` and\n      `<!--hy:/i:<island_id>-->` comment markers a real SSR render emitted\n      (see server/init.lua's ISLAND handling) and return an opaque handle\n      for it, or nil if not found. Must NOT create any DOM node -- this is\n      the \"claim existing DOM, don't rebuild it\" half of hydration\n      (mission invariant #41).\n    hy_query_button(handle) -> handle | nil\n      Find the <button> element within an island handle's range.\n    hy_get_text(handle) -> string\n    hy_set_text(handle, text: string)\n    hy_on_click(handle, callback: fun())\n      Attach a real DOM click listener that invokes `callback` (a Lua\n      function, called back into this same VM) when fired.\n\n  All handles are opaque to Lua -- this module never inspects them, only\n  passes them back to the host functions above. What a \"handle\" actually\n  is (an index into a host-side registry, a wrapped userdata, ...) is a\n  host implementation detail this module does not depend on.\n--]]\n\nlocal signals = require(\"hydronium.signals\")\n\nlocal M = {}\n\n--- Hydrates a single `<d.lua.island>` boundary known to contain exactly\n--- one `<Counter initial={N}/>`-shaped `<button>`.\n--- @param island_id string The island id from the SSR client plan (e.g. \"hy:i1\")\n--- @param initial number Starting count -- MUST match what SSR actually rendered;\n---   this function does not read the DOM's current text as its source of truth,\n---   matching real hydration (state comes from the component, not scraped HTML).\n--- @return table { get = fun(): number } for the resulting reactive count, for\n---   the caller (e.g. a test/proof harness) to inspect without a second DOM read.\nfunction M.hydrate_counter_island(island_id, initial)\n  local island = hy_find_island(island_id)\n  if not island then\n    error(\"hydronium.interpreter.lua: no DOM found for island `\" .. tostring(island_id) .. \"`\", 2)\n  end\n\n  local button = hy_query_button(island)\n  if not button then\n    error(\"hydronium.interpreter.lua: island `\" .. tostring(island_id) .. \"` has no <button> to hydrate\", 2)\n  end\n\n  local count, setCount = signals.createSignal(initial)\n\n  -- Real Hydronium reactivity, not a hand-called render() function: this\n  -- effect re-runs (and only this line re-runs) whenever `count` changes,\n  -- exactly as it would for any other Hydronium signal consumer.\n  signals.createEffect(function()\n    hy_set_text(button, \"Count: \" .. tostring(count()))\n  end)\n\n  hy_on_click(button, function()\n    setCount(count() + 1)\n  end)\n\n  return { get = count }\nend\n\n--- Hydrates a Counter island the same way as `hydrate_counter_island`,\n--- but structured so a real HMR refresh can be driven against it\n--- afterward: a `RefreshRegistry`-backed signal (state survives a\n--- refresh) and a real `Scope`-owned `Effect` (the old effect's cleanup\n--- runs exactly once when the old scope is disposed; the new effect\n--- runs exactly once after refresh) -- matching\n--- `tests/core/refresh_component_spec.lua`'s proof shape exactly, just\n--- against a real browser DOM via WASM Lua instead of the test host.\n---\n--- Deliberately does NOT go through `core.component`/`core.reconciler`\n--- (see `hydrate_counter_island`'s own doc comment for why this module\n--- stays narrow, not extended in place): this returns a `setup`\n--- function meant to be called directly inside\n--- `hydronium.core.scope.runWithScope(scope, setup, click_increment)`,\n--- the same host-bridge way `hydrate_counter_island` wires its own\n--- signal -- just parameterized so it can be called a second time,\n--- inside a fresh scope, with a different `click_increment` after a\n--- refresh, standing in for \"the developer edited the click handler's\n--- logic and it should take effect.\"\n---\n--- Extends the host contract above with one requirement:\n--- `hy_on_click(button, callback)` must replace any previously\n--- registered listener on that same `button` handle (not accumulate\n--- one per call) -- calling `setup` again after a refresh calls\n--- `hy_on_click` again on the same button, and the old scope's effect\n--- disposal (via `Scope:dispose()`'s existing cleanup) has no way to\n--- reach into host-side DOM listener bookkeeping to remove the old one\n--- itself.\n--- @param island_id string\n--- @param initial number\n--- @param registry table hydronium.core.refresh.RefreshRegistry\n--- @return fun(click_increment: number): table setup function -- call inside runWithScope\nfunction M.hydrate_counter_island_refreshable(island_id, initial, registry)\n  local island = hy_find_island(island_id)\n  if not island then\n    error(\"hydronium.interpreter.lua: no DOM found for island `\" .. tostring(island_id) .. \"`\", 2)\n  end\n\n  local button = hy_query_button(island)\n  if not button then\n    error(\"hydronium.interpreter.lua: island `\" .. tostring(island_id) .. \"` has no <button> to hydrate\", 2)\n  end\n\n  return function(click_increment)\n    registry:begin_generation()\n    local count, setCount = registry:signal(initial, { kind = \"signal\", name = \"count\", block_path = \"Counter.setup\" })\n    registry:finish_generation()\n\n    signals.createEffect(function()\n      hy_set_text(button, \"Count: \" .. tostring(count()))\n    end)\n\n    hy_on_click(button, function()\n      setCount(count() + click_increment)\n    end)\n\n    return count\n  end\nend\n\nreturn M\n"};

    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    function log(msg, cls) {
      console.log(msg);
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = msg;
      logEl.appendChild(line);
    }
    function setStatus(s) {
      statusEl.textContent = s;
      window.__hmrDemoStatus = s;
    }

    window.__hmrDemoResults = window.__hmrDemoResults || [];
    function check(label, actual, expected) {
      const ok = actual === expected;
      window.__hmrDemoResults.push({ label, actual, expected, ok });
      log(`${ok ? "PASS" : "FAIL"}: ${label} -- expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`, ok ? "pass" : "fail");
      return ok;
    }

    // --- Host bridge: the JS side of hydronium.interpreter.lua's
    // documented contract (hy_find_island/hy_query_button/hy_get_text/
    // hy_set_text/hy_on_click). hy_on_click REPLACES any previous
    // listener on the same button rather than accumulating one per call
    // -- see interpreter/lua.lua's own doc comment for why a refresh
    // needs this (it calls hy_on_click again on the same element).
    const clickListeners = new WeakMap();

    function findIslandRange(islandId) {
      const startMarker = `hy:i:${islandId}:lua`;
      const endMarker = `hy:/i:${islandId}`;
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_COMMENT);
      let startNode = null, endNode = null;
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue === startMarker) startNode = node;
        else if (node.nodeValue === endMarker && startNode) { endNode = node; break; }
      }
      if (!startNode || !endNode) return null;
      return { start: startNode, end: endNode };
    }

    globalThis.__host = {
      hy_find_island(islandId) {
        return findIslandRange(islandId);
      },
      hy_query_button(range) {
        if (!range) return null;
        let node = range.start.nextSibling;
        while (node && node !== range.end) {
          if (node.nodeType === 1 && node.tagName === "BUTTON") return node;
          node = node.nextSibling;
        }
        return null;
      },
      hy_get_text(button) {
        return button.textContent;
      },
      hy_set_text(button, text) {
        button.textContent = text;
      },
      hy_on_click(button, cb) {
        const prev = clickListeners.get(button);
        if (prev) button.removeEventListener("click", prev);
        const handler = () => cb();
        clickListeners.set(button, handler);
        button.addEventListener("click", handler);
      },
    };

    // --- DevTransport: the same real dev transport proven against
    // examples/meteorite_ssr's own live-reload page -- reused here
    // verbatim (src/hydronium/client/dev_transport.js), not a second
    // implementation. Reconnection is explicit/client-tracked, not
    // native EventSource auto-reconnect: verified live via Playwright
    // that Chromium does not reliably resend Last-Event-ID for named
    // SSE event types across an automatic reconnect, so the fingerprint
    // is tracked here and sent as an explicit ?since= query param on a
    // connection this code closes and reopens itself.
    function createDevTransport(url) {
      let closed = false;
      let listeners = [];
      let since = null;
      let source = null;

      function notify(type, fingerprint) {
        for (const cb of listeners) cb({ type, fingerprint });
      }

      function reconnect() {
        if (source) source.close();
        if (closed) return;
        // Cache-busting `_t` on every connection -- verified live that
        // without it, Chromium's HTTP cache served a stale response to
        // repeated identical `?since=...` reconnects instead of ever
        // reaching the server again (Meteorite's stream_begin has no
        // options argument to set Cache-Control). See dev_transport.js.
        const params = new URLSearchParams({ _t: String(Date.now()) });
        if (since) params.set("since", since);
        const fullUrl = `${url}?${params.toString()}`;
        source = new EventSource(fullUrl);
        source.addEventListener("hello", (ev) => { since = ev.data; notify("hello", ev.data); });
        source.addEventListener("reload", (ev) => { since = ev.data; notify("reload", ev.data); reconnect(); });
        source.addEventListener("bye", (ev) => { since = ev.data; reconnect(); });
      }

      reconnect();

      return {
        subscribe(cb) { listeners.push(cb); return () => { listeners = listeners.filter((l) => l !== cb); }; },
        close() { closed = true; if (source) source.close(); },
      };
    }

    const buttonEl = document.getElementById("counter-btn");

    async function main() {
      setStatus("Booting real Lua 5.4 WASM VM (wasmoon)...");
      const factory = new LuaFactory();
      const lua = await factory.createEngine();

      for (const [name, fn] of Object.entries(globalThis.__host)) {
        lua.global.set(name, fn);
      }

      setStatus("Registering real Hydronium modules (signals, scope, refresh, interpreter)...");
      for (const [modName, source] of Object.entries(EMBEDDED_MODULES)) {
        lua.global.set("__src_" + modName.replace(/\./g, "_"), source);
      }
      const preloadLua = Object.keys(EMBEDDED_MODULES).map((modName) => {
        const key = "__src_" + modName.replace(/\./g, "_");
        return `package.preload["${modName}"] = assert(load(${key}, "${modName}"))`;
      }).join("\n");
      await lua.doString(preloadLua);

      setStatus("Hydrating counter island (claiming existing SSR DOM, not rebuilding it)...");
      await lua.doString(`
        local interpreter = require("hydronium.interpreter.lua")
        local refresh = require("hydronium.core.refresh")
        local scope_mod = require("hydronium.core.scope")
        _G.__Scope = scope_mod.Scope
        _G.__runWithScope = scope_mod.runWithScope
        _G.__registry = refresh.RefreshRegistry.new()
        _G.__setup = interpreter.hydrate_counter_island_refreshable("hy:i1", 10, _G.__registry)
      `);

      lua.global.set("__click_increment", 1);
      await lua.doString(`
        _G.__scope1 = _G.__Scope.new(nil)
        _G.__count1 = _G.__runWithScope(_G.__scope1, _G.__setup, __click_increment)
      `);

      check("after hydrate, button text", buttonEl.textContent, "Count: 10");

      setStatus("Clicking twice (real DOM click events)...");
      buttonEl.click();
      buttonEl.click();
      check("after 2 clicks, button text", buttonEl.textContent, "Count: 12");

      setStatus("Live and hydrated. Waiting for a real dev-transport reload event (edit hmr_demo/click_increment.lua)...");

      const transport = createDevTransport("/__hydronium/watch");
      transport.subscribe(async (event) => {
        log(`[transport event] ${event.type}: ${event.fingerprint}`, "info");
        if (event.type !== "reload") return;

        try {
          setStatus("Dev update received -- fetching new source and running a real HMR refresh...");
          const newIncrementSource = await fetch("/__hydronium/hmr-demo-increment").then((r) => r.text());
          log("fetched new increment source: " + JSON.stringify(newIncrementSource), "info");
          lua.global.set("__new_increment_source", newIncrementSource);

          await lua.doString(`
            local new_increment = assert(load(__new_increment_source))()
            _G.__scope1:dispose()
            _G.__scope2 = _G.__Scope.new(nil)
            _G.__count2 = _G.__runWithScope(_G.__scope2, _G.__setup, new_increment)
            _G.__new_increment = new_increment
          `);

          const stateAfterRefresh = buttonEl.textContent;
          check("state preserved immediately after refresh", stateAfterRefresh, "Count: 12");

          buttonEl.click();
          const newIncrement = await lua.doString(`return _G.__new_increment`);
          const expected = "Count: " + (12 + newIncrement);
          check(`after 1 click post-refresh (new +${newIncrement} logic active)`, buttonEl.textContent, expected);
        } catch (e) {
          log("REFRESH HANDLER ERROR: " + e.message + "\n" + e.stack, "fail");
          window.__hmrDemoFatal = true;
        }

        setStatus("HMR proof complete.");
        window.__hmrDemoComplete = true;
        transport.close();
      });
    }

    main().catch((e) => {
      log("FATAL: " + e.message + "\n" + e.stack, "fail");
      setStatus("FAILED: " + e.message);
      window.__hmrDemoComplete = true;
      window.__hmrDemoFatal = true;
    });
  </script>
</body>
</html>
